
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate white contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: georgerodrigues04
          outputs: |
            dist/github-snake.svg?color_snake=%23FFFFFF&palette=github-dark

      - name: Publish snake animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
