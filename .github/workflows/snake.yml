
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate white snake with green squares
        uses: Platane/snk@v3
        with:
          github_user_name: georgerodrigues04
          outputs: |
            dist/github-snake.svg?color_snake=%23FFFFFF&color_dots=%230B3D1B,%230E7A2F,%2310B83F,%2300D936,%2300FF41

      - name: Set dark background
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/github-snake.svg")
          svg = path.read_text(encoding="utf-8")

          svg = svg.replace(
              "<svg ",
              '<svg style="background-color:#050608" ',
              1
          )

          path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
