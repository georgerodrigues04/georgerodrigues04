
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate white snake with green dots
        uses: Platane/snk@v3
        with:
          github_user_name: georgerodrigues04
          outputs: |
            dist/github-snake.svg?color_snake=%23FFFFFF&color_dots=%23051008,%2308170D,%230D2615,%2313371D,%231A4726

      - name: Add dark background
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("dist/github-snake.svg")
          temp = Path("dist/github-snake.tmp.svg")

          svg = path.read_text(encoding="utf-8")

          background = '<rect width="100%" height="100%" fill="#050608"/>'

          svg = re.sub(
              r'(<svg\b[^>]*>)',
              lambda match: match.group(1) + background,
              svg,
              count=1
          )

          if svg == path.read_text(encoding="utf-8"):
              raise RuntimeError("Não foi possível inserir o fundo SVG.")

          temp.write_text(svg, encoding="utf-8")
          os.replace(temp, path)
          PY

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
