
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate white snake with green dots
        uses: Platane/snk@v3
        with:
          github_user_name: georgerodrigues04
          outputs: |
            /tmp/github-snake.svg?color_snake=%23FFFFFF&color_dots=%23051008,%2308170D,%230D2615,%2313371D,%231A4726

      - name: Add dark background
        run: |
          mkdir -p publish

          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("/tmp/github-snake.svg")
          target = Path("publish/github-snake.svg")

          svg = source.read_text(encoding="utf-8")
          background = '<rect width="100%" height="100%" fill="#050608"/>'

          svg, count = re.subn(
              r'(<svg\b[^>]*>)',
              lambda match: match.group(1) + background,
              svg,
              count=1
          )

          if count != 1:
              raise RuntimeError("Não foi possível localizar a abertura do SVG.")

          target.write_text(svg, encoding="utf-8")
          print("Fundo escuro aplicado com sucesso.")
          PY

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          publish_branch: output
